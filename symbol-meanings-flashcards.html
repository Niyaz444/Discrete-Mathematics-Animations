<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symbol Meanings · Test Yourself</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEEE6; --card:#FFFFFF; --ink:#1C2B33; --ink-soft:#5B6670;
    --line:#D6D1C1; --gold:#C79A3E;
    --c1:#2F7A66; /* Basic Math - teal */
    --c2:#B8862B; /* Set Theory - amber gold */
    --c3:#6B4C9A; /* Number Systems - purple */
    --c4:#3B5BA5; /* Logical Symbols - blue */
    --c5:#C1752E; /* Relations & Posets - orange */
    --c6:#3F5A6B; /* Lattice & Boolean - slate */
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:'IBM Plex Sans',sans-serif;color:var(--ink);padding:32px 16px 80px;}
  .wrap{max-width:1100px;margin:0 auto;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);text-align:center;margin-bottom:8px;}
  h1.page-title{font-family:'Fraunces',serif;font-weight:600;text-align:center;font-size:clamp(24px,4.5vw,36px);margin:0 0 6px;}
  .sub{text-align:center;color:var(--ink-soft);font-size:14.5px;margin:0 auto 28px;max-width:640px;line-height:1.6;}

  /* ---------- Quick Quiz ---------- */
  .quiz-box{
    position:sticky; top:12px; z-index:30;
    background:var(--ink); color:#F4F2EA; border-radius:18px; padding:22px 24px;
    box-shadow:0 16px 34px -16px rgba(28,43,51,.65); margin-bottom:34px; text-align:center;
  }
  .quiz-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  .quiz-symbol{font-family:'IBM Plex Mono',monospace;font-size:clamp(38px,8vw,56px);font-weight:700;min-height:64px;display:flex;align-items:center;justify-content:center;}
  .quiz-cat{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;min-height:16px;}
  .quiz-meaning{
    font-family:'Fraunces',serif; font-size:19px; margin-top:10px; min-height:30px;
    opacity:0; transition:opacity .3s ease;
  }
  .quiz-meaning.show{opacity:1;}
  .quiz-btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
  .qbtn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
    padding:9px 18px;border-radius:20px;cursor:pointer;transition:.15s ease;border:1.5px solid #F4F2EA;
    background:transparent;color:#F4F2EA;
  }
  .qbtn:hover{background:#F4F2EA;color:var(--ink);}
  .qbtn.primary{background:var(--c1);border-color:var(--c1);color:#fff;}
  .qbtn.primary:hover{background:#256150;}
  .quiz-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:10px;}

  /* ---------- Section header ---------- */
  .sec-header{display:flex;align-items:center;gap:12px;margin:46px 0 6px;flex-wrap:wrap;}
  .sec-badge{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#fff; padding:5px 13px; border-radius:20px; white-space:nowrap;}
  .sec-title{font-family:'Fraunces',serif; font-weight:600; font-size:19px; color:var(--ink);}
  .sec-line{flex:1;height:1px;background:var(--line); min-width:20px;}
  .sec-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}

  .controls{display:flex;justify-content:center;gap:10px;margin:24px 0 10px;flex-wrap:wrap;}
  .ctrl-btn{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;background:#fff;border:1.5px solid var(--ink);color:var(--ink);padding:7px 14px;border-radius:20px;cursor:pointer;transition:.2s ease;}
  .ctrl-btn:hover{background:var(--ink);color:var(--paper);}

  /* ---------- Card grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;margin-bottom:8px;}
  .card-outer{perspective:1200px;height:130px;cursor:pointer;}
  .card-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
  .card-outer.flipped .card-inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 22px -14px rgba(28,43,51,.45);}
  .front{background:var(--card);border:1.5px solid rgba(28,43,51,.1);}
  .front .sym{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--ink);line-height:1.1;}
  .front .sym.big{font-size:34px;}
  .front .sym.small{font-size:18px;}
  .front .tap-hint{position:absolute;bottom:6px;font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .back{color:#fff;transform:rotateY(180deg);}
  .back .meaning{font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;line-height:1.35;}

  footer{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:46px;font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Discrete Mathematics · Reference</div>
  <h1 class="page-title">Symbol Meanings</h1>
  <p class="sub">Every symbol shows alone first — no meaning attached. Say the meaning out loud before you tap to check.</p>

  <div class="quiz-box">
    <div class="quiz-tag">Quick Quiz — Random Symbol</div>
    <div class="quiz-symbol" id="quizSymbol">?</div>
    <div class="quiz-cat" id="quizCat">&nbsp;</div>
    <div class="quiz-meaning" id="quizMeaning">&nbsp;</div>
    <div class="quiz-btns">
      <button class="qbtn primary" onclick="showQuizMeaning()">Show Meaning</button>
      <button class="qbtn" onclick="nextQuizSymbol()">Next Symbol</button>
    </div>
    <div class="quiz-count" id="quizCount">Symbol 1 of 67</div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" onclick="flipAll(true)">Flip All Cards</button>
    <button class="ctrl-btn" onclick="flipAll(false)">Reset All Cards</button>
  </div>

  <div id="sections"></div>

  <footer>Discrete Mathematics · Reference — Symbol Meanings</footer>
</div>

<script>
const categories = [
  { key:'basic', title:'Basic Mathematical Symbols', color:'var(--c1)', items:[
    {sym:'=', meaning:'Equality'},
    {sym:'≠', meaning:'Not equal to'},
    {sym:'<', meaning:'Less than'},
    {sym:'>', meaning:'Greater than'},
    {sym:'≤', meaning:'Less than or equal to'},
    {sym:'≥', meaning:'Greater than or equal to'},
    {sym:'≈', meaning:'Approximately equal to'},
    {sym:'≡', meaning:'Identically equal / Equivalent'},
    {sym:':=', meaning:'Defined as'},
    {sym:'∴', meaning:'Therefore'},
    {sym:'∵', meaning:'Because (Since)'},
    {sym:'⇒', meaning:'Implies (If…Then)'},
    {sym:'⇔', meaning:'If and only if (Implies and implied by)'}
  ]},
  { key:'set', title:'Set Theory Symbols', color:'var(--c2)', items:[
    {sym:'∈', meaning:'Element of (Belongs to)'},
    {sym:'∉', meaning:'Not an element of (Does not belong to)'},
    {sym:'⊂', meaning:'Proper subset'},
    {sym:'⊆', meaning:'Subset or equal to (Subset of)'},
    {sym:'⊃', meaning:'Proper superset'},
    {sym:'⊇', meaning:'Superset or equal to (Superset of)'},
    {sym:'⊄', meaning:'Not a subset'},
    {sym:'∅', meaning:'Empty set (Void)'},
    {sym:'U', meaning:'Universal set'},
    {sym:'∪', meaning:'Union'},
    {sym:'∩', meaning:'Intersection'},
    {sym:'A − B', meaning:'Set difference'},
    {sym:'Aᶜ', meaning:'Complement of A'},
    {sym:'A × B', meaning:'Cartesian product'},
    {sym:'𝒫(A)', meaning:'Power set'},
    {sym:'|A|', meaning:'Cardinality of A'}
  ]},
  { key:'num', title:'Number Systems', color:'var(--c3)', items:[
    {sym:'ℕ', meaning:'Natural numbers'},
    {sym:'ℤ', meaning:'Integers'},
    {sym:'ℚ', meaning:'Rational numbers'},
    {sym:'ℝ', meaning:'Real numbers'},
    {sym:'ℂ', meaning:'Complex numbers'}
  ]},
  { key:'logic', title:'Logical Symbols', color:'var(--c4)', items:[
    {sym:'¬', meaning:'Negation (NOT)'},
    {sym:'∧', meaning:'Conjunction (AND)'},
    {sym:'∨', meaning:'Disjunction (OR)'},
    {sym:'⊕', meaning:'Exclusive OR (XOR)'},
    {sym:'→', meaning:'Implication (Conditional)'},
    {sym:'↔', meaning:'Biconditional'},
    {sym:'∀', meaning:'For all (For every, Given any)'},
    {sym:'∃', meaning:'There exists (For some)'},
    {sym:'∃!', meaning:'There exists a unique'},
    {sym:'⊢', meaning:'Provable'},
    {sym:'⊨', meaning:'Logical consequence'},
    {sym:'≡', meaning:'Logical equivalence'}
  ]},
  { key:'rel', title:'Relations and Posets', color:'var(--c5)', items:[
    {sym:'R ⊆ A×B', meaning:'Relation'},
    {sym:'aRb', meaning:'a is related to b'},
    {sym:'R⁻¹', meaning:'Inverse relation'},
    {sym:'R∘S', meaning:'Composition of relations'},
    {sym:'Dom(R)', meaning:'Domain'},
    {sym:'Ran(R)', meaning:'Range'},
    {sym:'Δ_A', meaning:'Identity relation'},
    {sym:'⪯', meaning:'Partial order'},
    {sym:'≺', meaning:'Strict partial order'},
    {sym:'⪰', meaning:'Greater in partial order'},
    {sym:'∥', meaning:'Incomparable elements'}
  ]},
  { key:'lattice', title:'Lattice and Boolean Algebra Symbols', color:'var(--c6)', items:[
    {sym:'∨', meaning:'Join (least upper bound)'},
    {sym:'∧', meaning:'Meet (greatest lower bound)'},
    {sym:'0', meaning:'Least element / Boolean false'},
    {sym:'1', meaning:'Greatest element / Boolean true'},
    {sym:'T', meaning:'Truth value = True'},
    {sym:'F', meaning:'Truth value = False'},
    {sym:"A′", meaning:'Boolean complement'},
    {sym:'Ā', meaning:'Complement of A'},
    {sym:'+', meaning:'Boolean OR'},
    {sym:'·', meaning:'Boolean AND'}
  ]}
];

const sectionsEl = document.getElementById('sections');
const allSymbols = [];

categories.forEach(cat=>{
  const header = document.createElement('div');
  header.className = 'sec-header';
  header.innerHTML = `<span class="sec-badge" style="background:${cat.color}">${cat.title}</span><div class="sec-line"></div><span class="sec-count">${cat.items.length} symbols</span>`;
  sectionsEl.appendChild(header);

  const grid = document.createElement('div');
  grid.className = 'grid';

  cat.items.forEach(item=>{
    allSymbols.push({...item, cat: cat.title});
    const outer = document.createElement('div');
    outer.className = 'card-outer';
    const sizeClass = item.sym.length > 4 ? 'small' : 'big';
    outer.innerHTML = `
      <div class="card-inner">
        <div class="face front">
          <span class="sym ${sizeClass}">${item.sym}</span>
          <span class="tap-hint">tap to reveal</span>
        </div>
        <div class="face back" style="background:${cat.color}">
          <span class="meaning">${item.meaning}</span>
        </div>
      </div>`;
    outer.addEventListener('click', ()=> outer.classList.toggle('flipped'));
    grid.appendChild(outer);
  });

  sectionsEl.appendChild(grid);
});

function flipAll(state){
  document.querySelectorAll('.card-outer').forEach(c=>{
    if(state) c.classList.add('flipped'); else c.classList.remove('flipped');
  });
}

/* ---------- Quick Quiz ---------- */
let quizOrder = [];
let quizIndex = 0;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz(){
  quizOrder = shuffle(allSymbols);
  quizIndex = 0;
  renderQuizSymbol();
}

function renderQuizSymbol(){
  const item = quizOrder[quizIndex];
  document.getElementById('quizSymbol').textContent = item.sym;
  document.getElementById('quizCat').textContent = item.cat;
  const meaningEl = document.getElementById('quizMeaning');
  meaningEl.textContent = item.meaning;
  meaningEl.classList.remove('show');
  document.getElementById('quizCount').textContent = 'Symbol ' + (quizIndex+1) + ' of ' + allSymbols.length;
}

function showQuizMeaning(){
  document.getElementById('quizMeaning').classList.add('show');
}

function nextQuizSymbol(){
  quizIndex++;
  if(quizIndex >= quizOrder.length){
    quizOrder = shuffle(allSymbols);
    quizIndex = 0;
  }
  renderQuizSymbol();
}

startQuiz();
</script>
</body>
</html>
