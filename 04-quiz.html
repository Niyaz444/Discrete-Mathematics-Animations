<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz · Statements &amp; Notation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFEEE6; --card:#FFFFFF; --ink:#1C2B33; --ink-soft:#5B6670;
    --line:#D6D1C1; --teal:#2F7A66; --brick:#B5493D; --gold:#C79A3E;
    --lv1:#7FA79A; --lv2:#4F8A73; --lv3:#C79A3E; --lv4:#C17A3A; --lv5:#B5493D;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:'IBM Plex Sans',sans-serif;color:var(--ink);}
  .wrap{max-width:720px;margin:0 auto;padding:36px 16px 70px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);text-align:center;margin-bottom:8px;}
  h1.page-title{font-family:'Fraunces',serif;font-weight:600;text-align:center;font-size:clamp(26px,5vw,36px);margin:0 0 4px;}
  .sub{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:20px;}

  .score-bar{position:sticky;top:12px;z-index:10;display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#F4F2EA;border-radius:14px;padding:12px 18px;font-family:'IBM Plex Mono',monospace;font-size:13px;margin-bottom:28px;box-shadow:0 10px 26px -14px rgba(28,43,51,.6);}
  .score-bar strong{color:var(--gold);font-size:16px;}
  .reset-btn{background:transparent;border:1.5px solid #F4F2EA;color:#F4F2EA;border-radius:20px;padding:5px 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;}
  .reset-btn:hover{background:#F4F2EA;color:var(--ink);}

  .q-card{background:var(--card);border-radius:12px;padding:18px 20px;margin-bottom:16px;border:1px solid rgba(28,43,51,.08);box-shadow:0 6px 16px -12px rgba(28,43,51,.35);}
  .q-top{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
  .q-num{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--ink-soft);min-width:20px;}
  .lvl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:3px 8px;border-radius:20px;}
  .lv1{background:var(--lv1);} .lv2{background:var(--lv2);} .lv3{background:var(--lv3);}
  .lv4{background:var(--lv4);} .lv5{background:var(--lv5);}
  .q-text{font-size:15px;line-height:1.55;margin:0 0 12px;}
  .mono{font-family:'IBM Plex Mono',monospace;background:#F3F1E8;padding:1px 5px;border-radius:4px;}

  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer;transition:.15s ease;font-family:'IBM Plex Sans',sans-serif;}
  .opt:hover{border-color:var(--ink);}
  .opt.correct{border-color:var(--teal);background:#EAF4F0;color:var(--teal);font-weight:600;}
  .opt.wrong{border-color:var(--brick);background:#F8ECEA;color:var(--brick);font-weight:600;}
  .opt[disabled]{cursor:default;}

  .explain{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s ease,opacity .3s ease,margin .3s ease;}
  .q-card.answered .explain{max-height:300px;opacity:1;margin-top:12px;}
  .explain-inner{border-top:1px dashed var(--line);padding-top:10px;font-size:13.5px;line-height:1.6;display:flex;gap:10px;align-items:flex-start;}
  .stamp{flex-shrink:0;display:inline-block;border:2px solid var(--teal);color:var(--teal);padding:3px 9px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:10.5px;letter-spacing:.05em;white-space:nowrap;margin-top:2px;}
  .stamp.brick{border-color:var(--brick);color:var(--brick);}

  footer{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:36px;font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Discrete Mathematics · Module 1 · Predicate Calculus</div>
  <h1 class="page-title">Quiz</h1>
  <p class="sub">Topic 1 — Introduction: Statements &amp; Notation · 15 questions, Level 1 → 5</p>

  <div class="score-bar">
    <span>Score: <strong id="scoreDisplay">0 / 0</strong></span>
    <button class="reset-btn" onclick="resetQuiz()">Reset</button>
  </div>

  <div id="quiz"></div>

  <footer>Discrete Mathematics · Module 1 · Topic 1 Quiz — self-check only, doesn't record anywhere</footer>
</div>

<script>
const questions = [
  {lvl:1, q:'Which of these is a statement?', opts:['Please close the door.','New Delhi is the capital of India.','What time does class start?','Wow, that proof is elegant!'], correct:1, why:'It is declarative, checkable, and True. The others are a command, a question, and an exclamation.'},
  {lvl:1, q:'A statement must be:', opts:['Interesting','True or False, but not both','Written in symbols','Agreed upon by everyone'], correct:1, why:'The defining feature is a single, fixed truth value — nothing about interest, symbols, or universal agreement.'},
  {lvl:1, q:'True or False: "3 + 4 = 8" is a statement.', opts:['True — it is a statement (and it is False)','False — arithmetic sentences are never statements'], correct:0, why:'It is declarative and checkable, so it IS a statement — just a false one. Being false doesn\'t disqualify it.'},
  {lvl:2, q:'Which symbol convention is standard for naming statements?', opts:['Uppercase Roman numerals','Lowercase letters like p, q, r','Greek letters only','Numbers like 1, 2, 3'], correct:1, why:'Lowercase letters (p, q, r, s, …) are the standard notation for statements.'},
  {lvl:2, q:'"x + 3 = 10" is best classified as:', opts:['A true statement','A false statement','An open sentence','A paradox'], correct:2, why:'It contains a free variable x with no fixed value — an open sentence, not yet a statement.'},
  {lvl:2, q:'Why is "Football is more exciting than cricket" excluded from statements?', opts:['It is too short','It has no objective, shared truth test','It doesn\'t end with a full stop','It uses proper nouns'], correct:1, why:'It is an opinion — no universal test decides it, so no fixed truth value exists.'},
  {lvl:3, q:'"This sentence is false" fails to be a statement because:', opts:['It is too long','It refers to itself in a way that flips truth forever','It uses the word "false"','It isn\'t written in English'], correct:1, why:'Assuming True makes it False and vice versa — an unresolvable loop. This is the Liar Paradox.'},
  {lvl:3, q:'Let p: "It is raining." If it is currently NOT raining, then p is:', opts:['True','False','Undefined','Both True and False'], correct:1, why:'p\'s truth value tracks reality directly — no rain means p is False.'},
  {lvl:3, q:'Which rewrite turns a command into a genuine statement?', opts:['"Close the window" → "Is the window closed?"','"Close the window" → "The window is closed."','"Close the window" → "Close the window!"','It cannot be rewritten'], correct:1, why:'Turning the order into a declarative claim about the world makes it checkable — now it has a truth value.'},
  {lvl:4, q:'"There is life on other planets" is currently unverified. Is it still a statement?', opts:['No — unknown truth value means no statement','Yes — it has a definite truth value in principle, even if unknown to us','Only after scientists confirm it','Only if it is written in symbolic form'], correct:1, why:'Determinacy in principle is what matters, not our current knowledge. "Unknown" is not the same as "no truth value."'},
  {lvl:4, q:'A student says: "Every sentence ending in a period is a statement." What breaks this claim?', opts:['"2 + 2 = 4." (a true statement)','"Sit down." (a command ending in a period)','"Delhi is a city." (a true statement)','Nothing breaks it — the claim is correct'], correct:1, why:'A command can end in a full stop and still not be declarative — punctuation says nothing about truth-assessability.'},
  {lvl:4, q:'What is the key difference between "5 is prime" and "x is prime"?', opts:['One is longer than the other','One fixes the subject to a specific value; the other leaves it a free variable','One is written in English, the other in symbols','There is no real difference'], correct:1, why:'Fixing x = 5 collapses the open sentence into a determinate statement.'},
  {lvl:5, q:'Which of the following is the most defensible verdict on "Mathematics is beautiful"?', opts:['Always a true statement','Always a false statement','Not a statement — no shared objective test exists','A paradox like the Liar sentence'], correct:2, why:'It is grammatically declarative but has no universal test for truth — classified as opinion, not a statement.'},
  {lvl:5, q:'Why do logicians replace full sentences with single letters like p, q?', opts:['To save space only','To hide the sentence\'s meaning','To study the structure of reasoning independent of subject matter','Because words are not allowed in mathematics'], correct:2, why:'Symbolic notation lets the same inference rules apply no matter what the statements are actually about.'},
  {lvl:5, q:'Which new sentence below creates a genuine self-referential paradox (not just a false claim)?', opts:['"This sentence has five words."','"Statement A is true," where A reads "Statement A is false."','"All statements are false."','"I am lying about the weather."'], correct:1, why:'Tracing the pair forces truth values to flip with no stable resolution — the same mechanism as the Liar Paradox. The others are simply checkable (and in some cases just false), not paradoxical.'}
];

const quizEl = document.getElementById('quiz');
let answeredCount = 0, correctCount = 0;

questions.forEach((item, qi)=>{
  const card = document.createElement('div');
  card.className = 'q-card';
  card.id = 'quiz-q'+qi;
  card.innerHTML = `
    <div class="q-top"><span class="q-num">${qi+1}</span><span class="lvl lv${item.lvl}">Lv${item.lvl}</span></div>
    <p class="q-text">${item.q}</p>
    <div class="opts">
      ${item.opts.map((o,oi)=>`<button class="opt" data-oi="${oi}">${o}</button>`).join('')}
    </div>
    <div class="explain"><div class="explain-inner">
      <span class="stamp" id="stamp-${qi}">RESULT</span>
      <span>${item.why}</span>
    </div></div>
  `;
  quizEl.appendChild(card);

  const buttons = card.querySelectorAll('.opt');
  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(card.classList.contains('answered')) return;
      const chosen = parseInt(btn.dataset.oi);
      const isCorrect = chosen === item.correct;
      buttons.forEach((b,bi)=>{
        b.disabled = true;
        if(bi === item.correct) b.classList.add('correct');
        else if(bi === chosen) b.classList.add('wrong');
      });
      const stamp = document.getElementById('stamp-'+qi);
      if(isCorrect){ stamp.textContent='✓ CORRECT'; stamp.classList.remove('brick'); correctCount++; }
      else { stamp.textContent='✗ REVIEW'; stamp.classList.add('brick'); }
      card.classList.add('answered');
      answeredCount++;
      updateScore();
    });
  });
});

function updateScore(){
  document.getElementById('scoreDisplay').textContent = correctCount + ' / ' + answeredCount;
}

function resetQuiz(){
  answeredCount = 0; correctCount = 0;
  updateScore();
  document.querySelectorAll('.q-card').forEach(card=>{
    card.classList.remove('answered');
    card.querySelectorAll('.opt').forEach(b=>{
      b.disabled=false; b.classList.remove('correct','wrong');
    });
  });
  document.querySelectorAll('.stamp').forEach(s=>{ s.textContent='RESULT'; s.classList.remove('brick'); });
}
</script>
</body>
</html>
